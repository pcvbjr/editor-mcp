[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @editor-mcp/mcp-server... run build"

[deploy]
startCommand = "node apps/mcp-server/dist/http/cli.js"
healthcheckPath = "/readyz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 5
drainingSeconds = 35
